<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLM Claim Dashboard - รพ.เสลภูมิ</title>
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- นำเข้า FontAwesome สำหรับ Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- นำเข้า React และ ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- นำเข้า Babel สำหรับคอมไพล์ JSX ในหน้าเว็บ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        /* Custom Scrollbar สำหรับตารางและ Sidebar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // URL ของ API จาก Google Apps Script (ดึงข้อมูล Data & Statement)
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx0PKi_rileifhE0y-43sTRfPbY0Ok9nyqowcGwF1Tiveplfr2LGg1ttc-TFiPNuXeU/exec"; 
        
        function App() {
            const [currentView, setCurrentView] = useState('dashboard');
            const [isAdmin, setIsAdmin] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(true); // ควบคุม Sidebar บนมือถือ
            
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [searchQuery, setSearchQuery] = useState('');

            // Data State
            const [mockData, setMockData] = useState([]);
            const [mockStatement, setMockStatement] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [fetchError, setFetchError] = useState('');

            // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(GAS_API_URL);
                        const result = await response.json();
                        
                        setMockData(result.data || []);
                        setMockStatement(result.statement || []);
                        setIsLoading(false);
                    } catch (error) {
                        console.error("Error fetching data:", error);
                        setFetchError(error.message || "ไม่สามารถดึงข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่อ");
                        setIsLoading(false);
                    }
                };

                fetchData();
                
                // ตรวจสอบขนาดหน้าจอเพื่อซ่อน Sidebar บนมือถืออัตโนมัติ
                if (window.innerWidth < 1024) {
                    setIsSidebarOpen(false);
                }
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (username === 'admin' && password === '1234') {
                    setIsAdmin(true);
                    setCurrentView('individual-check');
                    setLoginError('');
                } else {
                    setLoginError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (ทดสอบใช้: admin / 1234)');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                setCurrentView('dashboard');
                setUsername('');
                setPassword('');
                setSearchQuery('');
            };

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(amount || 0);
            };

            const dashboardStats = useMemo(() => {
                const totalRecords = mockData.length;
                let totalClaim = 0;
                let totalPaid = 0;
                let successCount = 0;
                let pendingCount = 0;

                mockData.forEach(item => {
                    // แปลงค่าให้เป็นตัวเลขที่ถูกต้อง ป้องกัน NaN
                    const claimVal = parseFloat(item.claim) || 0;
                    const paidVal = parseFloat(item.paid) || 0;
                    totalClaim += claimVal;
                    totalPaid += paidVal;
                    
                    if (item.status && item.status.includes("ได้รับชดเชยแล้ว")) successCount++;
                    if (item.status && (item.status.includes("ยังไม่ได้รับชดเชย") || item.status.includes("รอ") || item.status.includes("#N/A"))) pendingCount++;
                });

                return { totalRecords, totalClaim, totalPaid, successCount, pendingCount };
            }, [mockData]);

            // --- Sidebar Component ---
            const renderSidebar = () => (
                <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 transition-transform duration-300 ease-in-out transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 lg:static lg:inset-auto flex flex-col shadow-2xl`}>
                    <div className="flex items-center justify-center h-20 border-b border-slate-800 bg-slate-900/50">
                        <div className="flex items-center px-4">
                            <div className="bg-blue-600 text-white p-2.5 rounded-xl mr-3 shadow-lg shadow-blue-900/20">
                                <i className="fa-solid fa-heart-pulse text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-white font-bold text-lg leading-tight tracking-wide">TLM Claim</h1>
                                <p className="text-blue-400 text-xs font-medium">รพ.เสลภูมิ</p>
                            </div>
                        </div>
                        {/* ปุ่มปิด Sidebar บนมือถือ */}
                        <button className="lg:hidden absolute right-4 text-slate-400 hover:text-white" onClick={() => setIsSidebarOpen(false)}>
                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>

                    <div className="flex flex-col flex-1 overflow-y-auto py-6 px-4 space-y-2">
                        <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 ml-2">เมนูหลัก (Main Menu)</p>
                        
                        <button 
                            onClick={() => { setCurrentView('dashboard'); if(window.innerWidth < 1024) setIsSidebarOpen(false); }}
                            className={`flex items-center w-full px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 ${currentView === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'hover:bg-slate-800 hover:text-white'}`}
                        >
                            <i className="fa-solid fa-chart-pie w-6"></i> ภาพรวมข้อมูล
                        </button>

                        <button 
                            onClick={() => { 
                                if(isAdmin) {
                                    setCurrentView('individual-check');
                                } else {
                                    setCurrentView('admin-login');
                                }
                                if(window.innerWidth < 1024) setIsSidebarOpen(false);
                            }}
                            className={`flex items-center w-full px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 ${currentView === 'individual-check' ? 'bg-blue-600 text-white shadow-md shadow-blue-900/20' : 'hover:bg-slate-800 hover:text-white'} ${(currentView === 'admin-login' && !isAdmin) ? 'bg-slate-800 text-white border border-slate-700' : ''}`}
                        >
                            <i className="fa-solid fa-magnifying-glass w-6"></i> ตรวจสอบรายบุคคล
                            {!isAdmin && <i className="fa-solid fa-lock text-xs ml-auto text-slate-500"></i>}
                        </button>
                    </div>

                    <div className="p-4 border-t border-slate-800 bg-slate-900">
                        {isAdmin ? (
                            <div className="bg-slate-800 rounded-xl p-4">
                                <div className="flex items-center mb-3">
                                    <div className="bg-emerald-500/20 text-emerald-400 w-8 h-8 rounded-full flex items-center justify-center mr-3">
                                        <i className="fa-solid fa-user-shield"></i>
                                    </div>
                                    <div>
                                        <p className="text-white text-sm font-medium">Admin Mode</p>
                                        <p className="text-emerald-400 text-xs">ยืนยันสิทธิ์แล้ว</p>
                                    </div>
                                </div>
                                <button 
                                    onClick={handleLogout}
                                    className="w-full flex items-center justify-center px-4 py-2 text-sm text-red-400 hover:text-white bg-red-500/10 hover:bg-red-500/20 rounded-lg transition-colors border border-red-500/20"
                                >
                                    <i className="fa-solid fa-arrow-right-from-bracket mr-2"></i> ออกจากระบบ
                                </button>
                            </div>
                        ) : (
                            <button 
                                onClick={() => { setCurrentView('admin-login'); if(window.innerWidth < 1024) setIsSidebarOpen(false); }}
                                className="w-full flex items-center justify-center px-4 py-3 text-sm font-medium text-white bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors border border-slate-700"
                            >
                                <i className="fa-solid fa-shield-halved mr-2"></i> เข้าสู่ระบบ Admin
                            </button>
                        )}
                    </div>
                </aside>
            );

            // --- Header Component ---
            const renderHeader = () => (
                <header className="bg-white h-20 px-6 border-b border-slate-200 flex items-center justify-between sticky top-0 z-40 shadow-sm">
                    <div className="flex items-center">
                        <button 
                            className="lg:hidden mr-4 text-slate-500 hover:text-blue-600 focus:outline-none"
                            onClick={() => setIsSidebarOpen(true)}
                        >
                            <i className="fa-solid fa-bars text-2xl"></i>
                        </button>
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 hidden sm:block">
                                {currentView === 'dashboard' && 'แดชบอร์ดรายงานภาพรวม (Dashboard)'}
                                {currentView === 'admin-login' && 'การยืนยันตัวตนผู้ดูแลระบบ (Admin Login)'}
                                {currentView === 'individual-check' && 'ตรวจสอบข้อมูลเบิกจ่ายรายบุคคล'}
                            </h2>
                            <p className="text-sm text-slate-500 hidden sm:block">ระบบจัดการและติดตามการเบิกจ่ายชดเชย กรณีให้เลือดผู้ป่วยธาลัสซีเมีย</p>
                            
                            {/* Mobile Title */}
                            <h2 className="text-lg font-bold text-slate-800 sm:hidden">
                                TLM Claim Dashboard
                            </h2>
                        </div>
                    </div>
                    <div className="flex items-center">
                        <div className="hidden md:flex items-center text-sm text-slate-500 bg-slate-100 px-4 py-2 rounded-full border border-slate-200">
                            <i className="fa-regular fa-calendar-check mr-2 text-blue-500"></i>
                            ข้อมูลอัปเดตอัตโนมัติจาก Google Sheets
                        </div>
                    </div>
                </header>
            );

            // --- Dashboard View ---
            const renderDashboard = () => (
                <div className="space-y-6 animate-[fadeIn_0.5s_ease-out]">
                    
                    {/* Summary Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group hover:shadow-md transition-shadow">
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-blue-50 rounded-full group-hover:scale-150 transition-transform duration-500 ease-in-out"></div>
                            <div className="relative z-10 flex justify-between items-start">
                                <div>
                                    <p className="text-sm font-semibold text-slate-500 mb-1">ยอดขอเบิกทั้งหมด</p>
                                    <h3 className="text-3xl font-bold text-slate-800 tracking-tight">{formatCurrency(dashboardStats.totalClaim)}</h3>
                                </div>
                                <div className="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center">
                                    <i className="fa-solid fa-file-invoice-dollar text-xl"></i>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group hover:shadow-md transition-shadow">
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-emerald-50 rounded-full group-hover:scale-150 transition-transform duration-500 ease-in-out"></div>
                            <div className="relative z-10 flex justify-between items-start">
                                <div>
                                    <p className="text-sm font-semibold text-slate-500 mb-1">ยอดจ่ายชดเชยแล้ว</p>
                                    <h3 className="text-3xl font-bold text-emerald-600 tracking-tight">{formatCurrency(dashboardStats.totalPaid)}</h3>
                                </div>
                                <div className="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
                                    <i className="fa-solid fa-hand-holding-dollar text-xl"></i>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group hover:shadow-md transition-shadow">
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-green-50 rounded-full group-hover:scale-150 transition-transform duration-500 ease-in-out"></div>
                            <div className="relative z-10 flex justify-between items-start">
                                <div>
                                    <p className="text-sm font-semibold text-slate-500 mb-1">รายการที่สำเร็จ</p>
                                    <div className="flex items-baseline">
                                        <h3 className="text-3xl font-bold text-slate-800 tracking-tight">{dashboardStats.successCount}</h3>
                                        <span className="text-sm text-slate-500 ml-2">รายการ</span>
                                    </div>
                                </div>
                                <div className="w-12 h-12 rounded-xl bg-green-100 text-green-600 flex items-center justify-center">
                                    <i className="fa-solid fa-circle-check text-xl"></i>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group hover:shadow-md transition-shadow">
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-amber-50 rounded-full group-hover:scale-150 transition-transform duration-500 ease-in-out"></div>
                            <div className="relative z-10 flex justify-between items-start">
                                <div>
                                    <p className="text-sm font-semibold text-slate-500 mb-1">รอชดเชย / ไม่พบข้อมูล</p>
                                    <div className="flex items-baseline">
                                        <h3 className="text-3xl font-bold text-slate-800 tracking-tight">{dashboardStats.pendingCount}</h3>
                                        <span className="text-sm text-slate-500 ml-2">รายการ</span>
                                    </div>
                                </div>
                                <div className="w-12 h-12 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center">
                                    <i className="fa-solid fa-clock-rotate-left text-xl"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Table Section */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-6">
                        <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white">
                            <h3 className="text-lg font-bold text-slate-800 flex items-center">
                                <i className="fa-solid fa-list-ul mr-3 text-blue-500"></i> รายการขอเบิก 10 รายการล่าสุด
                            </h3>
                            <span className="text-xs bg-slate-100 text-slate-500 px-3 py-1 rounded-full border border-slate-200">
                                ดึงข้อมูลจากชีต Data
                            </span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-slate-200">
                                <thead className="bg-slate-50">
                                    <tr>
                                        <th className="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">วันที่รับบริการ</th>
                                        <th className="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">ชื่อ - นามสกุล</th>
                                        <th className="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">ขอเบิก</th>
                                        <th className="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">ชดเชย</th>
                                        <th className="px-6 py-4 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">สถานะ</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-slate-100">
                                    {mockData.slice(0, 10).map((row, idx) => {
                                        const isSuccess = row.status && row.status.includes('ได้รับชดเชยแล้ว');
                                        return (
                                        <tr key={idx} className="hover:bg-slate-50/80 transition-colors">
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-600">{row.date}</td>
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                <div className="flex items-center">
                                                    <div className="h-8 w-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-xs mr-3">
                                                        {row.name ? row.name.charAt(0) : '?'}
                                                    </div>
                                                    <span className="text-sm font-semibold text-slate-800">{row.name}</span>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-right text-slate-500">{formatCurrency(row.claim)}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-right font-semibold text-emerald-600">{formatCurrency(row.paid)}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-center">
                                                <span className={`px-3 py-1.5 inline-flex text-xs leading-5 font-semibold rounded-full border ${
                                                    isSuccess ? 'bg-green-50 text-green-700 border-green-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                                                }`}>
                                                    <i className={`fa-solid ${isSuccess ? 'fa-check' : 'fa-triangle-exclamation'} mr-1.5 mt-0.5`}></i>
                                                    {row.status || 'รอตรวจสอบ'}
                                                </span>
                                            </td>
                                        </tr>
                                    )})}
                                    {mockData.length === 0 && (
                                        <tr>
                                            <td colSpan="5" className="px-6 py-10 text-center text-slate-500">
                                                <i className="fa-solid fa-folder-open text-3xl mb-3 text-slate-300"></i>
                                                <p>ไม่พบข้อมูล หรือกำลังเชื่อมต่อระบบ...</p>
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            // --- Admin Login View ---
            const renderLogin = () => (
                <div className="flex items-center justify-center min-h-[60vh] animate-[fadeIn_0.3s_ease-out]">
                    <div className="bg-white p-8 sm:p-10 rounded-3xl shadow-lg border border-slate-100 w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="mx-auto bg-slate-900 w-16 h-16 rounded-2xl flex items-center justify-center mb-5 shadow-lg shadow-slate-900/20">
                                <i className="fa-solid fa-shield-halved text-white text-3xl"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-slate-900">Admin Login</h2>
                            <p className="text-sm text-slate-500 mt-2">กรุณาเข้าสู่ระบบเพื่อใช้งานเมนูตรวจสอบรายบุคคล</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-5">
                            {loginError && (
                                <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm flex items-start border border-red-100">
                                    <i className="fa-solid fa-circle-exclamation mt-0.5 mr-2"></i> 
                                    <span>{loginError}</span>
                                </div>
                            )}
                            
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <i className="fa-solid fa-user"></i>
                                    </div>
                                    <input 
                                        type="text" 
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all text-slate-800"
                                        placeholder="กรอกชื่อผู้ใช้งาน..."
                                        required
                                    />
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all text-slate-800"
                                        placeholder="••••••••"
                                        required
                                    />
                                </div>
                            </div>

                            <button 
                                type="submit" 
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md shadow-blue-600/20 mt-4"
                            >
                                เข้าสู่ระบบ (Login)
                            </button>
                        </form>
                    </div>
                </div>
            );

            // --- Individual Check View ---
            const renderIndividualCheck = () => {
                const filteredData = mockData.filter(item => 
                    (item.cid && item.cid.includes(searchQuery)) || (item.name && item.name.includes(searchQuery))
                );
                
                const filteredStatement = mockStatement.filter(item => 
                    (item.cid && item.cid.includes(searchQuery)) || (item.name && item.name.includes(searchQuery))
                );

                const hasSearched = searchQuery.trim().length >= 2;

                return (
                    <div className="space-y-6 animate-[fadeIn_0.5s_ease-out]">
                        
                        {/* Search Box */}
                        <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
                            <h2 className="text-xl font-bold text-slate-800 mb-2">ค้นหาประวัติการเบิกจ่ายชดเชย</h2>
                            <p className="text-sm text-slate-500 mb-6">คุณสามารถค้นหาด้วยเลขบัตรประชาชน 13 หลัก (CID) หรือ ชื่อ-นามสกุล ของผู้ป่วย</p>
                            
                            <div className="relative max-w-3xl">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i className="fa-solid fa-magnifying-glass text-slate-400 text-lg"></i>
                                </div>
                                <input
                                    type="text"
                                    className="block w-full pl-12 pr-12 py-4 border-2 border-slate-200 rounded-2xl leading-5 bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 text-base transition-all"
                                    placeholder="กรอกชื่อ-สกุล หรือ CID อย่างน้อย 3 ตัวอักษร..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                                {searchQuery && (
                                    <button 
                                        onClick={() => setSearchQuery('')}
                                        className="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-red-500 transition-colors"
                                    >
                                        <i className="fa-solid fa-circle-xmark text-xl"></i>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Search Results */}
                        {hasSearched && (
                            <div className="grid grid-cols-1 gap-6 mt-6">
                                
                                {/* 1. Data Summary Table */}
                                <div className="bg-white rounded-2xl shadow-sm border border-blue-100 overflow-hidden">
                                    <div className="px-6 py-4 border-b border-blue-100 bg-blue-50/80 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                                        <h3 className="text-lg font-bold text-blue-900 flex items-center">
                                            <i className="fa-solid fa-file-lines mr-2 text-blue-600"></i> สรุปข้อมูลขอเบิก (จากไฟล์ Data)
                                        </h3>
                                        <span className="text-xs font-semibold bg-white text-blue-600 px-3 py-1 rounded-full border border-blue-200 shadow-sm">
                                            พบ {filteredData.length} รายการ
                                        </span>
                                    </div>
                                    
                                    {filteredData.length > 0 ? (
                                        <div className="overflow-x-auto">
                                            <table className="min-w-full divide-y divide-slate-200">
                                                <thead className="bg-white">
                                                    <tr>
                                                        <th className="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">CID</th>
                                                        <th className="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">ชื่อ - นามสกุล</th>
                                                        <th className="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">วันที่รับบริการ</th>
                                                        <th className="px-6 py-3 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">ขอเบิก</th>
                                                        <th className="px-6 py-3 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">ชดเชย</th>
                                                        <th className="px-6 py-3 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">สถานะ</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-slate-100">
                                                    {filteredData.map((row, idx) => {
                                                        const isSuccess = row.status && row.status.includes('ได้รับชดเชยแล้ว');
                                                        return(
                                                        <tr key={idx} className="hover:bg-slate-50">
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-mono text-slate-500">{row.cid}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-800">{row.name}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-600">{row.date}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-right text-slate-500">{formatCurrency(row.claim)}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-right font-bold text-slate-800">{formatCurrency(row.paid)}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-center">
                                                                <span className={`px-3 py-1.5 inline-flex text-xs leading-5 font-semibold rounded-full border ${
                                                                    isSuccess ? 'bg-green-50 text-green-700 border-green-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                                                                }`}>
                                                                    {row.status}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    )})}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : (
                                        <div className="p-10 text-center text-slate-500 bg-slate-50">
                                            <i className="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
                                            <p>ไม่พบประวัติการขอเบิกสำหรับคำค้นหานี้</p>
                                        </div>
                                    )}
                                </div>

                                {/* 2. Statement Details Table */}
                                <div className="bg-white rounded-2xl shadow-sm border border-emerald-100 overflow-hidden">
                                    <div className="px-6 py-4 border-b border-emerald-100 bg-emerald-50/80 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                                        <h3 className="text-lg font-bold text-emerald-900 flex items-center">
                                            <i className="fa-solid fa-money-bill-transfer mr-2 text-emerald-600"></i> รายละเอียด Statement (เงินโอน)
                                        </h3>
                                        <span className="text-xs font-semibold bg-white text-emerald-600 px-3 py-1 rounded-full border border-emerald-200 shadow-sm">
                                            พบ {filteredStatement.length} รายการ
                                        </span>
                                    </div>
                                    
                                    {filteredStatement.length > 0 ? (
                                        <div className="overflow-x-auto">
                                            <table className="min-w-full divide-y divide-slate-200">
                                                <thead className="bg-white">
                                                    <tr>
                                                        <th className="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Rep No. (งวด)</th>
                                                        <th className="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">วันที่รับบริการ</th>
                                                        <th className="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">สิทธิ์</th>
                                                        <th className="px-6 py-3 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">รายการเบิก</th>
                                                        <th className="px-6 py-3 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">ยอดขอเบิก</th>
                                                        <th className="px-6 py-3 text-right text-xs font-bold text-emerald-600 uppercase tracking-wider">จ่ายชดเชยสุทธิ</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-slate-100">
                                                    {filteredStatement.map((row, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50">
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-mono font-medium text-slate-500">{row.repNo}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-800">{row.date}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm">
                                                                <span className="px-2 py-1 bg-slate-100 border border-slate-200 text-slate-600 rounded text-xs font-bold">
                                                                    {row.right}
                                                                </span>
                                                            </td>
                                                            <td className="px-6 py-4 text-sm text-slate-700 max-w-xs truncate" title={row.item}>{row.item}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-right text-slate-500">{formatCurrency(row.claim)}</td>
                                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-right font-bold text-emerald-600 bg-emerald-50/30">{formatCurrency(row.paid)}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : (
                                        <div className="p-10 text-center text-slate-500 bg-slate-50">
                                            <i className="fa-solid fa-receipt text-4xl text-slate-300 mb-3"></i>
                                            <p>ไม่พบรายการเงินโอน (Statement) สำหรับคำค้นหานี้</p>
                                            <p className="text-xs text-slate-400 mt-1">*เคสนี้อาจอยู่ระหว่างรอการโอนเงินจากส่วนกลาง</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="flex h-screen bg-slate-50 font-sans">
                    {/* Sidebar Area */}
                    {renderSidebar()}

                    {/* Overlay สำหรับมือถือเมื่อเปิด Sidebar */}
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden"
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {renderHeader()}

                        <main className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 scroll-smooth">
                            {isLoading ? (
                                <div className="flex flex-col items-center justify-center h-full min-h-[50vh]">
                                    <div className="loader mb-4"></div>
                                    <p className="text-slate-500 font-medium animate-pulse">กำลังโหลดข้อมูลจากฐานข้อมูล...</p>
                                </div>
                            ) : fetchError ? (
                                <div className="bg-red-50 text-red-600 p-8 rounded-2xl border border-red-200 text-center max-w-2xl mx-auto mt-10 shadow-sm">
                                    <i className="fa-solid fa-triangle-exclamation text-5xl mb-4 text-red-400"></i>
                                    <h3 className="text-xl font-bold mb-2">เกิดข้อผิดพลาดในการเชื่อมต่อ</h3>
                                    <p className="text-slate-700">{fetchError}</p>
                                    <button onClick={() => window.location.reload()} className="mt-6 px-6 py-2 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 font-medium text-slate-700 transition-colors">
                                        ลองใหม่อีกครั้ง
                                    </button>
                                </div>
                            ) : (
                                <div className="max-w-7xl mx-auto pb-10">
                                    {currentView === 'dashboard' && renderDashboard()}
                                    {currentView === 'admin-login' && renderLogin()}
                                    {currentView === 'individual-check' && (
                                        isAdmin ? renderIndividualCheck() : renderLogin()
                                    )}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // เพิ่ม Style Keyframes สำหรับ Animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
